name: edgeops

services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: edgeops
      POSTGRES_USER: edgeops
      POSTGRES_PASSWORD: edgeops
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U edgeops -d edgeops"]
      interval: 5s
      timeout: 5s
      retries: 10
    restart: unless-stopped

  emqx:
    image: emqx/emqx:5.8.8
    environment:
      EMQX_NODE_NAME: emqx@127.0.0.1
      EMQX_DASHBOARD__DEFAULT_USERNAME: admin
      EMQX_DASHBOARD__DEFAULT_PASSWORD: edgeops
    ports:
      - "127.0.0.1:1883:1883"
      - "127.0.0.1:18083:18083"
    volumes:
      - emqx-data:/opt/emqx/data
      - emqx-log:/opt/emqx/log
    healthcheck:
      test: ["CMD", "/opt/emqx/bin/emqx", "ctl", "status"]
      interval: 10s
      timeout: 5s
      retries: 10
    restart: unless-stopped

volumes:
  postgres-data:
  emqx-data:
  emqx-log:
